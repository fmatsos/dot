# Static binaries, SHA256SUMS and its Ed25519 signature published on a vX.Y.Z tag.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require go.mod
        run: |
          [ -f go.mod ] || { echo "::error::go.mod absent : rien à publier."; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build the four binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir dist
          for t in linux/amd64/linux-x64 linux/arm64/linux-arm64 darwin/amd64/macos-x64 darwin/arm64/macos-arm64; do
            IFS=/ read -r os arch name <<< "$t"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/dot-$name" ./cmd/dot
          done
          (cd dist && sha256sum dot-* > SHA256SUMS && cat SHA256SUMS)
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pubkey=$(tr -d '[:space:]' < internal/selfupdate/release.pub)
          [ -n "$pubkey" ] || { echo "::error::internal/selfupdate/release.pub est vide : lance scripts/gen-release-key.sh."; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::le secret RELEASE_SIGNING_KEY est vide ou absent."; exit 1; }
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key" "$RUNNER_TEMP/release-pub.der" "$RUNNER_TEMP/release-pub.pem"' EXIT
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          # Check against the key committed in the repo (the one compiled into the binary).
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf %s "$pubkey" | base64 -d; } > "$RUNNER_TEMP/release-pub.der"
          [ "$(wc -c < "$RUNNER_TEMP/release-pub.der")" -eq 44 ] || { echo "::error::release.pub invalide (32 octets attendus)."; exit 1; }
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/release-pub.der" -out "$RUNNER_TEMP/release-pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-pub.pem" -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig \
            || { echo "::error::la signature ne correspond pas à release.pub : secret et clé publique divergent."; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's generated notes, without the owner's own name: no "by @owner", no "New Contributors" entry for them
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body |
            sed -E "s/ by @$GITHUB_REPOSITORY_OWNER in / in /; /^\* @$GITHUB_REPOSITORY_OWNER made their first contribution/d" |
            perl -0pe 's/## New Contributors\n+(?=\*\*Full Changelog)//')
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes "$notes" dist/dot-* dist/SHA256SUMS dist/SHA256SUMS.sig
